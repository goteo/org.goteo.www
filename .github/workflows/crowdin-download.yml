name: Crowdin Download Translations

on:
    repository_dispatch:
        types:
            - crowdin-translations-ready
    schedule:
        - cron: '0 8 * * *'
    workflow_dispatch:

jobs:
    download:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: develop
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download translations from Crowdin
              uses: crowdin/github-action@v2
              with:
                  upload_sources: false
                  upload_translations: false
                  download_translations: true
                  push_translations: true
                  create_pull_request: false
                  skip_untranslated_strings: true
                  crowdin_branch_name: develop
                  commit_message: 'chore: add translations from Crowdin [skip ci]'
                  github_user_name: 'github-actions[bot]'
                  github_user_email: 'github-actions[bot]@users.noreply.github.com'
              env:
                  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
