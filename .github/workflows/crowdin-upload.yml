name: Crowdin Upload Source

on:
    push:
        branches:
            - develop
            - feat/implement-crowdin-auto-translation-pipeline
        paths:
            - "src/i18n/locales/es.json"
    workflow_dispatch:

jobs:
    upload:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Upload source file to Crowdin
              uses: crowdin/github-action@v2
              with:
                  upload_sources: true
                  upload_translations: false
                  download_translations: false
                  push_translations: false
                  create_pull_request: false
                  crowdin_branch_name: develop
              env:
                  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Trigger AI Pre-translation in Crowdin
              run: |
                  curl -s -X POST \
                    "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/pre-translations" \
                    -H "Authorization: Bearer ${{ secrets.CROWDIN_PERSONAL_TOKEN }}" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "method": "ai",
                      "aiPromptId": ${{ secrets.CROWDIN_AI_PROMPT_ID }},
                      "languageIds": ["en", "ca"],
                      "fileIds": []
                    }'
